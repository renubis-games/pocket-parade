<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Pocket Parade — Privacy Policy</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#1e293b;font:16px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:850px;margin:auto;padding:32px 20px 70px}header{background:linear-gradient(120deg,#262d65,#574aa0);color:white;padding:34px 30px;border-radius:22px}h1{margin:0;font-size:clamp(28px,5vw,40px)}.subtitle{opacity:.85;margin:4px 0 0}nav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}button{background:white;color:#31375f;border:1px solid #d6dbec;border-radius:9px;padding:10px 13px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#373d86;color:white;border-color:#373d86}main{background:white;border:1px solid #e1e6f1;border-radius:18px;padding:12px 30px 28px}section{padding:10px 0;border-bottom:1px solid #eef0f5}section:last-child{border:0}h2{font-size:20px;margin:12px 0 5px}p{margin:0 0 10px}a{color:#303e9e}footer{color:#64748b;text-align:center;font-size:13px;margin-top:24px}@media(max-width:540px){main{padding:12px 18px}header{padding:25px 20px}}</style></head><body><div class="wrap"><header><h1>Pocket Parade</h1><p class="subtitle" id="title">Privacy Policy</p></header><nav aria-label="Choose language"><button type="button" data-lang="en" aria-pressed="false">English</button><button type="button" data-lang="pl" aria-pressed="false">Polski</button><button type="button" data-lang="es" aria-pressed="false">Español</button><button type="button" data-lang="fr" aria-pressed="false">Français</button><button type="button" data-lang="ru" aria-pressed="false">Русский</button></nav><main id="policy" aria-live="polite"></main><footer>© 2026 Pocket Parade · <a href="mailto:renubis.it@gmail.com">renubis.it@gmail.com</a></footer></div><script>const policies={"en": {"name": "English", "title": "Privacy Policy", "updated": "Last updated: 23 November 2026", "sections": [["Overview", "This Privacy Policy explains how Pocket Parade, an Android game, handles information. For privacy-related questions, contact renubis.it@gmail.com."], ["Information and accounts", "The game does not require an account or ask players to provide personal information. Subject to verification of the final release build, the developer does not collect or transmit personal information through the game."], ["Local game data", "The game stores progress, unlocked levels, scores, medals, character selections, difficulty settings and preferences locally on the device. This information is used to save your progress and settings."], ["Ads and purchases", "Pocket Parade is free to play and contains no advertisements or in-app purchases."], ["Third-party services", "The game is not intended to use advertising or analytics SDKs. Distribution through Google Play is subject to Google’s own privacy practices. The final release build should be checked for third-party services and data transmission."], ["Retention and deletion", "Local game data remains on the device until removed, for example by clearing app storage. Uninstalling normally removes local data, but device backups may retain copies depending on Android settings."], ["Children", "The game does not require children to register or submit personal information. The developer does not intentionally collect personal information from children through the game, subject to verification of the final build."], ["Changes", "This policy may be updated if the game or applicable requirements change. The current version will be published at this address."], ["Contact", "For privacy questions, email renubis.it@gmail.com."]]}, "pl": {"name": "Polski", "title": "Polityka prywatności", "updated": "Ostatnia aktualizacja: 23 listopada 2026 r.", "sections": [["Informacje ogólne", "Niniejsza polityka wyjaśnia, jak gra Pocket Parade na Androida postępuje z informacjami. W sprawach prywatności napisz na renubis.it@gmail.com."], ["Dane i konta", "Gra nie wymaga konta ani podawania danych osobowych. Z zastrzeżeniem weryfikacji ostatecznej wersji aplikacji twórca nie zbiera ani nie przesyła danych osobowych za pośrednictwem gry."], ["Lokalne dane gry", "Gra zapisuje lokalnie postępy, odblokowane poziomy, wyniki, medale, wybór postaci, poziom trudności i ustawienia. Informacje te służą do zachowania postępów i preferencji."], ["Reklamy i zakupy", "Pocket Parade jest bezpłatna i nie zawiera reklam ani zakupów w aplikacji."], ["Usługi zewnętrzne", "Gra nie ma wykorzystywać reklamowych ani analitycznych zestawów SDK. Dystrybucja przez Google Play podlega odrębnym zasadom prywatności Google. Przed publikacją należy sprawdzić końcową wersję pod kątem usług zewnętrznych i transmisji danych."], ["Przechowywanie i usuwanie", "Dane lokalne pozostają na urządzeniu do ich usunięcia, np. przez wyczyszczenie danych aplikacji. Odinstalowanie zwykle usuwa dane lokalne, ale kopie zapasowe urządzenia mogą je zachować, zależnie od ustawień Androida."], ["Dzieci", "Gra nie wymaga od dzieci rejestracji ani przekazywania danych osobowych. Twórca nie zamierza zbierać danych osobowych dzieci za pośrednictwem gry; wymaga to potwierdzenia w końcowej wersji."], ["Zmiany", "Polityka może być aktualizowana w razie zmian w grze lub obowiązujących wymaganiach. Aktualna wersja będzie publikowana pod tym adresem."], ["Kontakt", "Pytania dotyczące prywatności: renubis.it@gmail.com."]]}, "es": {"name": "Español", "title": "Política de privacidad", "updated": "Última actualización: 23 de noviembre de 2026", "sections": [["Información general", "Esta política explica cómo Pocket Parade, un juego para Android, trata la información. Para consultas sobre privacidad, escribe a renubis.it@gmail.com."], ["Datos y cuentas", "El juego no requiere una cuenta ni solicita datos personales. Sujeto a la verificación de la versión final, el desarrollador no recopila ni transmite datos personales a través del juego."], ["Datos locales del juego", "El juego guarda localmente el progreso, los niveles desbloqueados, las puntuaciones, las medallas, los personajes seleccionados, la dificultad y las preferencias. Estos datos permiten conservar el progreso y la configuración."], ["Publicidad y compras", "Pocket Parade es gratuito y no contiene anuncios ni compras dentro de la aplicación."], ["Servicios de terceros", "El juego no está diseñado para utilizar SDK de publicidad o análisis. La distribución a través de Google Play está sujeta a las prácticas de privacidad de Google. Debe comprobarse la versión final para detectar servicios externos y transmisión de datos."], ["Conservación y eliminación", "Los datos locales permanecen en el dispositivo hasta que se eliminan, por ejemplo, al borrar los datos de la aplicación. La desinstalación suele eliminarlos, pero las copias de seguridad del dispositivo pueden conservarlos según la configuración de Android."], ["Menores", "El juego no exige que los menores se registren ni proporcionen datos personales. El desarrollador no pretende recopilar datos personales de menores a través del juego, sujeto a la verificación de la versión final."], ["Cambios", "Esta política puede actualizarse si cambian el juego o los requisitos aplicables. La versión vigente se publicará en esta dirección."], ["Contacto", "Para consultas sobre privacidad: renubis.it@gmail.com."]]}, "fr": {"name": "Français", "title": "Politique de confidentialité", "updated": "Dernière mise à jour : 23 novembre 2026", "sections": [["Présentation", "Cette politique explique comment Pocket Parade, un jeu Android, traite les informations. Pour toute question relative à la confidentialité, écrivez à renubis.it@gmail.com."], ["Données et comptes", "Le jeu ne nécessite pas de compte et ne demande pas de données personnelles. Sous réserve de vérification de la version finale, le développeur ne collecte ni ne transmet de données personnelles par l’intermédiaire du jeu."], ["Données locales du jeu", "Le jeu enregistre localement la progression, les niveaux débloqués, les scores, les médailles, les personnages choisis, la difficulté et les préférences. Ces informations servent à conserver la progression et les paramètres."], ["Publicités et achats", "Pocket Parade est gratuit et ne contient ni publicité ni achat intégré."], ["Services tiers", "Le jeu n’est pas destiné à utiliser de SDK publicitaire ou d’analyse. La distribution via Google Play relève des propres pratiques de confidentialité de Google. La version finale doit être vérifiée afin de détecter les services tiers et les transmissions de données."], ["Conservation et suppression", "Les données locales restent sur l’appareil jusqu’à leur suppression, par exemple en effaçant les données de l’application. La désinstallation les supprime généralement, mais les sauvegardes de l’appareil peuvent en conserver des copies selon les paramètres Android."], ["Enfants", "Le jeu n’exige pas que les enfants s’inscrivent ou fournissent des données personnelles. Le développeur n’a pas l’intention de collecter leurs données personnelles via le jeu, sous réserve de vérification de la version finale."], ["Modifications", "Cette politique peut être mise à jour si le jeu ou les exigences applicables changent. La version en vigueur sera publiée à cette adresse."], ["Contact", "Questions relatives à la confidentialité : renubis.it@gmail.com."]]}, "ru": {"name": "Русский", "title": "Политика конфиденциальности", "updated": "Последнее обновление: 23 ноября 2026 г.", "sections": [["Общие сведения", "Эта политика объясняет, как игра Pocket Parade для Android обращается с информацией. По вопросам конфиденциальности пишите на renubis.it@gmail.com."], ["Данные и учётные записи", "Игра не требует регистрации и предоставления персональных данных. При условии проверки окончательной версии разработчик не собирает и не передаёт персональные данные через игру."], ["Локальные данные игры", "Игра сохраняет на устройстве прогресс, открытые уровни, результаты, медали, выбранных персонажей, сложность и настройки. Эти сведения нужны для сохранения прогресса и предпочтений."], ["Реклама и покупки", "Pocket Parade распространяется бесплатно и не содержит рекламы или встроенных покупок."], ["Сторонние сервисы", "Игра не предназначена для использования рекламных или аналитических SDK. Распространение через Google Play регулируется собственными правилами конфиденциальности Google. Перед публикацией необходимо проверить финальную сборку на наличие сторонних сервисов и передачи данных."], ["Хранение и удаление", "Локальные данные остаются на устройстве до удаления, например при очистке данных приложения. Удаление приложения обычно удаляет локальные данные, однако резервные копии устройства могут их сохранять в зависимости от настроек Android."], ["Дети", "Игра не требует от детей регистрации или предоставления персональных данных. Разработчик не намерен собирать персональные данные детей через игру; это необходимо подтвердить при проверке финальной версии."], ["Изменения", "Политика может обновляться при изменениях игры или применимых требований. Актуальная версия будет размещена по этому адресу."], ["Контакты", "Вопросы о конфиденциальности: renubis.it@gmail.com."]]}};function show(lang){if(!policies[lang])lang='en';const p=policies[lang];document.documentElement.lang=lang;document.title='Pocket Parade — '+p.title;document.getElementById('title').textContent=p.title;document.getElementById('policy').replaceChildren();const main=document.getElementById('policy');const updated=document.createElement('p');updated.textContent=p.updated;main.append(updated);for(const [heading,content] of p.sections){const section=document.createElement('section'),h=document.createElement('h2'),body=document.createElement('p');h.textContent=heading;body.textContent=content;section.append(h,body);main.append(section)}document.querySelectorAll('button[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));history.replaceState(null,'','#'+lang)}document.querySelectorAll('button[data-lang]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.lang)));const initial=location.hash.slice(1)||navigator.language.toLowerCase().split('-')[0];show(initial);</script></body></html>
